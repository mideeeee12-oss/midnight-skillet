<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Midnight Skillet — a tiny late-night diner</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b1c28;
    min-height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  canvas {
    width: min(100vw, 1280px);
    height: auto;
    aspect-ratio: 1280 / 800;
    display: block;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
    border-radius: 6px;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
